    <!-- Consent Mode v2: tudo negado por padrão; se a pessoa já escolheu numa visita
         anterior, a escolha é reaplicada aqui, antes do GTM. Precisa vir ANTES do snippet do GTM. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}

      gtag('consent', 'default', {
        ad_storage: 'denied',
        analytics_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        wait_for_update: 500
      });

      // Restaura a escolha salva (mesma chave, versão e validade de src/lib/consent.ts)
      try {
        var c = JSON.parse(localStorage.getItem('arq_consent') || 'null');
        var valido = c && c.version === 1 &&
          (Date.now() - new Date(c.updatedAt).getTime()) < 365 * 864e5;
        if (valido) {
          var mkt = c.marketing ? 'granted' : 'denied';
          gtag('consent', 'update', {
            analytics_storage: c.analytics ? 'granted' : 'denied',
            ad_storage: mkt,
            ad_user_data: mkt,
            ad_personalization: mkt
          });
        }
      } catch (e) {}
    </script>

    <!-- Google Tag Manager -->

    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-5DTMCZW8');</script>
